stages:
  - test
  - build

default:
  interruptible: true

variables:
  GOPROXY: "https://goproxy.cn,direct"

test:
  stage: test
  image: golang:1.25
  script:
    - go test ./...

build:macos-artifact:
  stage: build
  tags:
    - macos
  before_script:
    - go version
    - xcodebuild -version
    - make bootstrap-mobile
  script:
    - make build-macos-artifact
  artifacts:
    name: "jiluoyun-core-macos-${CI_COMMIT_SHA}"
    expire_in: never
    paths:
      - build/JiluoyunCore.xcframework/
      - build/macos-SHA256SUMS
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

build:windows-artifact:
  stage: build
  image: golang:1.25
  script:
    - make build-windows-artifact
  artifacts:
    name: "jiluoyun-core-windows-${CI_COMMIT_SHA}"
    expire_in: never
    paths:
      - build/jiluoyun-core-windows-amd64.exe
      - build/jiluoyun-core-windows-arm64.exe
      - build/windows-SHA256SUMS
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

build:ios-artifact:
  stage: build
  tags:
    - macos
  before_script:
    - go version
    - xcodebuild -version
    - make bootstrap-mobile
  script:
    - make build-ios-artifact
  artifacts:
    name: "jiluoyun-core-ios-${CI_COMMIT_SHA}"
    expire_in: never
    paths:
      - build/JiluoyunCore.xcframework.zip
      - build/ios-SHA256SUMS
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

build:android-artifact:
  stage: build
  tags:
    - macos
  before_script:
    - go version
    - test -n "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
    - make bootstrap-mobile
  script:
    - make build-android-artifact
  artifacts:
    name: "jiluoyun-core-android-${CI_COMMIT_SHA}"
    expire_in: never
    paths:
      - build/jiluoyun-core.aar
      - build/android-SHA256SUMS
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
