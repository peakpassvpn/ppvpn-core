stages:
  - test
  - build

default:
  interruptible: true

variables:
  GOPROXY: "https://goproxy.cn,direct"

test:
  stage: test
  image: golang:1.25
  script:
    - go test ./...

build:macos-artifact:
  stage: build
  tags:
    - macos
  before_script:
    - go version
    - export DEVELOPER_DIR="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print -quit)/Contents/Developer"
    - test -d "${DEVELOPER_DIR}"
    - xcodebuild -version
    - make bootstrap-mobile
  script:
    - make build-macos-artifact
  artifacts:
    name: "jiluoyun-core-macos-${CI_COMMIT_SHA}"
    expire_in: never
    paths:
      - build/JiluoyunCore.xcframework/
      - build/macos-SHA256SUMS
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

build:windows-artifact:
  stage: build
  image: golang:1.25
  script:
    - make build-windows-artifact
  artifacts:
    name: "jiluoyun-core-windows-${CI_COMMIT_SHA}"
    expire_in: never
    paths:
      - build/jiluoyun-core-windows-amd64.exe
      - build/jiluoyun-core-windows-arm64.exe
      - build/windows-SHA256SUMS
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

build:ios-artifact:
  stage: build
  tags:
    - macos
  before_script:
    - go version
    - export DEVELOPER_DIR="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print -quit)/Contents/Developer"
    - test -d "${DEVELOPER_DIR}"
    - xcodebuild -version
    - make bootstrap-mobile
  script:
    - make build-ios-artifact
  artifacts:
    name: "jiluoyun-core-ios-${CI_COMMIT_SHA}"
    expire_in: never
    paths:
      - build/JiluoyunCore.xcframework.zip
      - build/ios-SHA256SUMS
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

build:android-artifact:
  stage: build
  image: golang:1.25
  variables:
    ANDROID_HOME: "${CI_PROJECT_DIR}/.android-sdk"
    ANDROID_SDK_ROOT: "${CI_PROJECT_DIR}/.android-sdk"
  cache:
    key: "android-ndk-29.0.14206865"
    paths:
      - .android-sdk/ndk/29.0.14206865/
  before_script:
    - go version
    - apt-get update
    - apt-get install -y --no-install-recommends curl unzip
    - mkdir -p "${ANDROID_HOME}/ndk"
    - |
      if [ ! -x "${ANDROID_HOME}/ndk/29.0.14206865/ndk-build" ]; then
        curl --fail --location --retry 3 \
          --output android-ndk-r29-linux.zip \
          https://dl.google.com/android/repository/android-ndk-r29-linux.zip
        echo "87e2bb7e9be5d6a1c6cdf5ec40dd4e0c6d07c30b  android-ndk-r29-linux.zip" |
          sha1sum --check -
        unzip -q android-ndk-r29-linux.zip
        mv android-ndk-r29 "${ANDROID_HOME}/ndk/29.0.14206865"
      fi
    - make bootstrap-mobile
  script:
    - make build-android-artifact
  artifacts:
    name: "jiluoyun-core-android-${CI_COMMIT_SHA}"
    expire_in: never
    paths:
      - build/jiluoyun-core.aar
      - build/android-SHA256SUMS
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
